<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Cuaca</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #00c6ff, #0072ff);
      color: #fff;
      text-align: center;
      padding: 50px;
    }
    .container {
      background: rgba(0,0,0,0.3);
      padding: 30px;
      border-radius: 10px;
      max-width: 400px;
      margin: auto;
    }
    input, button {
      padding: 10px;
      border-radius: 5px;
      border: none;
      margin: 10px 0;
      width: 80%;
    }
    button {
      background: #005bea;
      color: white;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Cek Cuaca</h1>
    <input type="text" id="city" placeholder="Masukkan nama kota">
    <button onclick="cekCuaca()">Lihat Cuaca</button>
    <div id="result"></div>
  </div>

  <script>
    async function cekCuaca() {
      const kota = document.getElementById("city").value;
      const apiKey = "YOUR_API_KEY"; // Ganti dengan API key dari OpenWeatherMap
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${kota}&appid=${apiKey}&units=metric&lang=id`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Kota tidak ditemukan.");
        const data = await response.json();

        const hasil = `
          <h2>${data.name}, ${data.sys.country}</h2>
          <p><strong>Cuaca:</strong> ${data.weather[0].description}</p>
          <p><strong>Suhu:</strong> ${data.main.temp}°C</p>
          <p><strong>Kelembapan:</strong> ${data.main.humidity}%</p>
          <p><strong>Angin:</strong> ${data.wind.speed} m/s</p>
        `;
        document.getElementById("result").innerHTML = hasil;
      } catch (err) {
        document.getElementById("result").innerHTML = `<p>${err.message}</p>`;
      }
    }
  </script>

</body>
</html>
